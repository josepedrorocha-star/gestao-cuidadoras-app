<link rel="icon" type="image/png" href="icones/icone-192.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<meta name="theme-color" content="#2f6f62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuidadoras">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head><body>
<style>
:root{
  --bg:#f6f3ee; --card:#ffffff; --ink:#22201c; --mute:#6f6a62; --line:#e4ded4;
  --acc:#2f6f62; --acc2:#e8f1ee; --red:#b3402e; --red2:#fbeae6; --green:#2e7d4f; --green2:#e6f4ec;
  --amb:#8a5f00; --amb2:#fff1d6; --sab:#efe6cf; --dom:#e9dcc0; --fer:#fbded4; --fdsb:#a07a2c; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --nota:#fffbe8; --notab:#e8dca8; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1a18; --card:#25231f; --ink:#ece7de; --mute:#a69f93; --line:#3a3731;
    --acc:#6cc2ad; --acc2:#23362f; --red:#f08a74; --red2:#3b2420; --green:#7fd19f; --green2:#1f3328;
    --amb:#f0c060; --amb2:#3a2f14; --sab:#332d22; --dom:#3a3226; --fer:#45241e; --fdsb:#d1a75a; --shadow:none;
    --nota:#2e2a1c; --notab:#5a5232; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#1b1a18; --card:#25231f; --ink:#ece7de; --mute:#a69f93; --line:#3a3731;
    --acc:#6cc2ad; --acc2:#23362f; --red:#f08a74; --red2:#3b2420; --green:#7fd19f; --green2:#1f3328;
    --amb:#f0c060; --amb2:#3a2f14; --sab:#332d22; --dom:#3a3226; --fer:#45241e; --fdsb:#d1a75a; --shadow:none;
    --nota:#2e2a1c; --notab:#5a5232; color-scheme:dark;
}
*{box-sizing:border-box}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:1200px;margin:0 auto;padding:8px 16px 4px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:nowrap;white-space:nowrap}
h1 .estado{font-size:12px;font-weight:600;width:auto}
h1 small{display:block;font-size:12px;color:var(--mute);font-weight:500}
.mesnav{display:flex;align-items:center;gap:6px;margin-left:auto}
.mesnav .mes{min-width:150px;display:inline-flex;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:17px;padding:0 10px;white-space:nowrap}
.mesnav .mes .mt{flex:none}
.mesnav .mes .est{flex:none;font-size:11px;margin:0 0 0 2px;line-height:1.5}
.tema{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.tema button{border:0;background:none;padding:6px 9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mute)}
.tema button.on{background:var(--acc);color:#fff}
.estado{font-size:12px;color:var(--mute);width:100%}
.ficheiro{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:420px}
.estado.aviso{color:var(--red)}
nav{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;padding:9px 12px;border-bottom:3px solid transparent;cursor:pointer;color:var(--mute);font-weight:600;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--acc)}
main{max-width:1200px;margin:0 auto;padding:16px 16px 60px}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.d{color:var(--red)}
.btn.s{padding:4px 9px;font-size:13px}
.btn.i{padding:5px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)}
h2{font-size:16px;margin:22px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2 .sp{flex:1}
.mute{color:var(--mute)} .small{font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=email],select,textarea{
  border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;min-width:0}
input[type=number]{width:90px}
textarea{width:100%;min-height:54px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);font-weight:600}
label.f input,label.f select,label.f textarea{font-size:14px;color:var(--ink);font-weight:400;width:100%}
.fg>*,.taxas>*,.col .head>*{min-width:0}
.col{min-width:0;overflow:hidden}
/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h{font-size:12px;font-weight:700;color:var(--mute);text-align:center;padding:4px 0}
.cal-d{min-height:96px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal-d:hover{border-color:var(--acc)}
.cal-d.vazio{background:none;border:0;cursor:default}
.cal-d.t-sab,.cal-d.t-dom{background:var(--sab);border-color:var(--fdsb)} .cal-d.t-dom{background:var(--dom)}
.cal-d.t-fer{background:var(--fer);border:2px solid var(--red)}
.cal-h.fds{color:var(--fdsb);background:var(--sab);border-radius:6px}
.bdg{font-size:9.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:1px 5px;border-radius:4px;margin-left:auto;white-space:nowrap}
.bdg.fds{background:var(--fdsb);color:#fff} .bdg.fer{background:var(--red);color:#fff}
.contagem{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.contagem span{font-size:13px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);background:var(--bg)}
.contagem span.fds{background:var(--sab);border-color:var(--fdsb)} .contagem span.fer{background:var(--fer);border-color:var(--red)}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.segs.x{grid-template-columns:repeat(4,1fr)} .segs.x .seg{border-style:dashed}
.seglab{font-size:12px;font-weight:700;color:var(--mute);margin:8px 0 4px}
.seg{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;cursor:pointer;font-weight:600;font-size:13px;text-align:center;line-height:1.2}
.seg span{display:block;font-size:20px}
.seg.on{border-color:var(--acc);background:var(--acc2);color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.prev{font-size:14px;background:var(--acc2);color:var(--acc);border-radius:8px;padding:6px 10px;font-weight:600}
.cal-d.hoje{outline:2px solid var(--acc);outline-offset:-1px}
.cal-n{font-weight:700;font-size:13px;display:flex;gap:4px;align-items:baseline}
.fer{font-size:10px;font-weight:600;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.x{border-left-style:dashed;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,transparent) 0 5px,color-mix(in srgb,var(--c) 6%,transparent) 5px 10px);font-weight:600}
.chip{font-size:11.5px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px}
/* pagamentos */
.pags{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.pag{border-top:4px solid var(--c)}
.pag h3{margin:0 0 2px;font-size:16px;display:flex;gap:8px;align-items:center}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--acc2);color:var(--acc)}
.tag.off{background:var(--line);color:var(--mute)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:700}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;border-bottom:0;font-size:16px}
.iban{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.ok{color:var(--green);font-weight:700} .ko{color:var(--red);font-weight:700}
.btn.pg{background:var(--green2);color:var(--green);border-color:var(--green)}
tr.it td{font-size:14px} tr.it.feito td:first-child{color:var(--mute)}
.acts{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
tr.sub td{font-size:14px;font-weight:600}
.est{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.est-pago{background:var(--green2);color:var(--green)} .est-parcial{background:var(--amb2);color:var(--amb)} .est-porpagar{background:var(--red2);color:var(--red)}
.estado-mes{margin-bottom:14px;border-left:5px solid var(--line)} .est-b-pago{border-left-color:var(--green)} .est-b-parcial{border-left-color:#d9a400} .est-b-porpagar{border-left-color:var(--red)}
.pessoa-est{font-size:13px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--bg)}
.pessoa-est.ok{background:var(--green2);color:var(--green);font-weight:600} .pessoa-est.parc{background:var(--amb2);color:var(--amb)}
.chip.pg{opacity:.85} .chip .ck{color:var(--green);margin-right:3px}
.notas-mes textarea{min-height:64px;background:var(--nota);border-color:var(--notab)}
@media print{.notas-mes textarea{border:0;background:none;resize:none}}
details.horarios summary{cursor:pointer;list-style:revert}
tr.diasep td{background:var(--bg);font-size:12px;font-weight:700;color:var(--mute);padding:5px 8px;border-top:2px solid var(--line);border-bottom:1px solid var(--line);text-transform:capitalize}
tr.diasep .bdg{text-transform:uppercase}
.chip.aj{border-left-style:dotted;background:color-mix(in srgb,var(--c) 8%,var(--card));font-style:italic}
.pago{background:var(--green2);border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:8px;margin-top:8px}
.linhas td input[type=text]{width:100%}
.linhas td input[type=number]{width:100px;text-align:right}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
/* colaboradores */
.cols{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.col{border-left:5px solid var(--c)}
.col .head{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.col .head input{font-weight:700;font-size:16px;flex:1}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.fg .w{grid-column:1/-1}
.taxas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.taxas input{width:100%}
.calc{font-size:12.5px;color:var(--mute);background:var(--bg);border-radius:8px;padding:6px 8px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:50;overflow:auto}
#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:14px;max-width:520px;width:100%;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#modal h3{margin:0 0 4px}
.turno{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.turno .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.turno .t{flex:1}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);text-align:center;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
footer{text-align:center;color:var(--mute);font-size:12px;padding:20px}
.help{background:var(--acc2);border-radius:10px;padding:10px 12px;font-size:13.5px}
.help b{color:var(--acc)}
/* lista de dias (vista para telemóvel) */
nav .sh{display:none}
details.col>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
details.col>summary::-webkit-details-marker{display:none}
.col-sum .dot{width:14px;height:14px;border-radius:50%;flex:none}
.col-nome{font-weight:700;font-size:16px}
.col-info{flex:1 1 100%;font-size:13px;color:var(--mute);order:5}
.col-ab{margin-left:auto;font-size:13px;font-weight:600;color:var(--acc);border:1px solid var(--line);border-radius:8px;padding:3px 9px}
details.col[open] .col-ab{background:var(--acc2)}
details.col[open] .col-ab::after{content:" ▲"} details.col:not([open]) .col-ab::after{content:" ▼"}
.chk{display:flex;gap:8px;align-items:flex-start}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}
.seta{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;background:var(--bg);border:1px solid var(--line);font-size:13px;color:var(--mute);transition:transform .15s;flex:none}
details.sec:not([open])>summary .seta{transform:rotate(-90deg)}
.sec-t{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sec-x{margin-left:auto;display:flex;align-items:center;gap:8px}
details.sec[open]>.sec-b{margin-top:12px}
details.sec.card{margin-bottom:12px}
details.sec.plain{margin:18px 0 6px}
details.sec.plain>summary{padding:4px 0}
.cmp-dias{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.cmp-dias select{max-width:260px}
.sp-l select{max-width:220px}
.aviso-p{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--amb2);color:var(--amb);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ss-in{display:flex;align-items:center;gap:6px}.ss-in input{flex:1;width:auto!important}.ss-in span{color:var(--mute);font-size:12px;white-space:nowrap}
.segs.ss3{grid-template-columns:repeat(3,1fr)} .segs.ss2{grid-template-columns:repeat(2,1fr)}
.seg small{display:block;font-weight:500;font-size:11px;color:var(--mute);margin-top:2px}
.seg.on small{color:var(--acc)}
.seg:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ss-hero{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;background:var(--acc);color:#fff;border-radius:12px;padding:14px 16px}
.ss-hero .l{font-size:12px;text-transform:uppercase;letter-spacing:.04em;opacity:.9;font-weight:700}
.ss-hero .v{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums} .ss-hero .v2{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.ss-hero .small{opacity:.9}
.ss-h{font-size:14px;margin:16px 0 4px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.ss-final{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding:12px 14px;border-radius:10px;border:2px solid var(--acc);background:var(--acc2)}
.ss-final .l{font-weight:800;font-size:15px}.ss-final .v{font-size:24px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}.ss-final .v.neg{color:var(--red)}
.ss-ref{margin-top:12px}
table.enc th,table.enc td{vertical-align:top} table.enc td:last-child{font-size:13.5px} table.enc td:first-child{font-weight:600;white-space:nowrap}
.ss-h-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tog{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0}
.tog button{border:0;background:var(--card);padding:6px 12px;font-weight:700;font-size:13px;color:var(--mute);cursor:pointer}
.tog button.on{background:var(--acc);color:#fff}
.aima-box{border-radius:10px;padding:10px 12px;border-left:4px solid var(--pos,#2f7d4f);background:var(--acc2)}
.aima-box.no{border-left-color:var(--red);background:rgba(200,60,50,.1)}
.aima-box .small{margin-top:4px;color:var(--ink);font-weight:400}
.ss-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.ss-top{justify-content:space-between;margin-bottom:12px;gap:10px}
@media (max-width:760px){.ss-top{flex-direction:column;align-items:stretch}.ss-top .btn{width:100%;padding:12px}}
.btn{text-decoration:none} a.btn{color:inherit;display:inline-flex;align-items:center;gap:6px}
@media (max-width:760px){.rec-acts .btn{flex:1 1 100%;justify-content:center;padding:12px}}
.recibo-bar{margin-top:8px;padding:10px;border-radius:10px;background:var(--amb2);gap:8px}
.recibo-bar .btn{flex:1 1 160px;justify-content:center}
.lst-d,.cal-d{scroll-margin-top:150px}
.pp{margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.pp-t{margin-bottom:6px}
.pp-g{display:grid;grid-template-columns:minmax(70px,1.1fr) repeat(3,minmax(0,1fr));gap:6px;align-items:center}
.pp-h{font-size:12.5px;font-weight:700;text-align:center;color:var(--mute)}
.pp-l{font-size:13px;font-weight:600}
.pp-g input{width:100%;min-width:0;padding:7px 6px;text-align:right}
.lembs{display:flex;flex-direction:column;gap:8px}
.lemb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border-left:4px solid var(--acc);font-size:14px}
.lemb.am{border-left-color:#d4a017}.lemb.red{border-left-color:var(--red)}
.lemb-ic{font-size:18px}.lemb-t{flex:1;min-width:0}.lemb-b{flex-shrink:0}
@media (max-width:760px){.lemb{flex-wrap:wrap}.lemb-b{width:100%;padding-left:28px}}
.cal-pgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.cal-pg{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px}
.cal-pg-h{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.cal-pg-l{display:grid;grid-template-columns:44px 1fr auto;gap:6px;font-size:13.5px;padding:3px 0;align-items:baseline}
.cal-pg-l .dia{font-weight:800;color:var(--acc);white-space:nowrap} .cal-pg-l .n{font-variant-numeric:tabular-nums}
.cal-pg-l.passou{opacity:.5}
@media (max-width:760px){
input[type=checkbox]{width:20px;height:20px;vertical-align:middle;accent-color:var(--acc)}

/* JSON estável (chaves ordenadas) para comparar versões sem falsos positivos */
function sJ(x){if(x===undefined)return 'undefined';if(x===null||typeof x!=='object')return JSON.stringify(x);if(Array.isArray(x))return '['+x.map(sJ).join(',')+']';return '{'+Object.keys(x).filter(k=>x[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+sJ(x[k])).join(',')+'}'}
const igual=(a,b)=>sJ(a)===sJ(b);
const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
const isIdArr=x=>Array.isArray(x)&&x.every(i=>isObj(i)&&i.id!=null);
/* junção a três vias: B = última versão comum, L = local, R = o que está agora na base partilhada */
function merge3(B,L,R){
  if(igual(L,B))return R;
  if(igual(R,B)||igual(L,R))return L;
  if(isObj(L)&&isObj(R)){const B0=isObj(B)?B:{},out={};
    for(const k of new Set([...Object.keys(B0),...Object.keys(L),...Object.keys(R)])){const v=merge3(B0[k],L[k],R[k]);if(v!==undefined)out[k]=v}
    return out}
  if(isIdArr(L)&&isIdArr(R)&&(B===undefined||isIdArr(B))){
    const bm=new Map((B||[]).map(i=>[i.id,i])),lm=new Map(L.map(i=>[i.id,i])),vistos=new Set(),out=[];
    for(const it of R){vistos.add(it.id);const v=merge3(bm.get(it.id),lm.get(it.id),it);if(v!==undefined)out.push(v)}
    for(const it of L){if(vistos.has(it.id))continue;const v=merge3(bm.get(it.id),it,undefined);if(v!==undefined)out.push(v)}
    return out}
  return L;
}

async function comTrava(nome,fn){
  const trava=DB.doc('travas/'+nome);
  for(let t=0;t<25;t++){
    let r;try{r=await trava.acquire({holder:EU,ttlMs:2000})}catch(e){r={acquired:true}}
    if(r&&r.acquired)return await fn();
    await dorme(250+Math.random()*350);
  }
  return await fn();
}

/* Só estas contas podem entrar. As mesmas estão nas regras de segurança do Firebase (regras-firestore.txt). */
const PERMITIDOS=['josepedrorocha@gmail.com','anammrocha1@gmail.com'];
let entrada='a verificar',utilizador=null,erroEntrada='';
/* Cada documento fica guardado como texto JSON no campo "j": assim aceita tudo o que a app grava
   (listas dentro de listas, campos vazios) exatamente como antes, sem conversões. */
function criarDB(fs){
  const LIM=950000;
  const emb=s=>({exists:s.exists,id:s.id,metadata:s.metadata,
    data:()=>{const x=s.data();if(!x)return undefined;return typeof x.j==='string'?JSON.parse(x.j):x}});
  const doc=p=>{const r=fs.doc(p);return{
    get:async()=>emb(await r.get()),
    set:d=>{const j=JSON.stringify(d);
      if(j.length>LIM)return Promise.reject({code:'too-big',message:'documento demasiado grande ('+p+')'});
      return r.set({j,em:firebase.firestore.FieldValue.serverTimestamp(),por:(utilizador&&utilizador.email)||''})},
    delete:()=>r.delete(),
    onSnapshot:(cb,err)=>r.onSnapshot({includeMetadataChanges:true},s=>cb(emb(s)),err),
    /* trava curta: só um aparelho de cada vez lê-junta-grava o mesmo documento */
    acquire:({holder,ttlMs})=>fs.runTransaction(async tx=>{
      const s=await tx.get(r),d=s.exists?s.data():null,agora=Date.now();
      if(d&&d.holder!==holder&&d.ate>agora)return{acquired:false};
      tx.set(r,{holder,ate:agora+ttlMs});return{acquired:true}})
  }};
  return{doc,collection:p=>({onSnapshot:(cb,err)=>fs.collection(p).onSnapshot({includeMetadataChanges:true},
    q=>cb({metadata:q.metadata,docChanges:()=>q.docChanges().map(ch=>({type:ch.type,doc:emb(ch.doc)}))}),err)})};
}
const MSG_ENTRADA={
  'auth/network-request-failed':'Sem ligação à internet. Verifique a rede e tente de novo.',
  'auth/unauthorized-domain':'Este endereço ainda não está autorizado no Firebase (Authentication → Settings → Authorized domains).',
  'auth/too-many-requests':'Demasiadas tentativas. Espere um pouco e tente de novo.',
  'auth/internal-error':'O Google não respondeu. Tente de novo.'};
async function entrarGoogle(){
  erroEntrada='';
  const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  try{await firebase.auth().signInWithPopup(p)}
  catch(e){const c=e&&e.code;
    if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;
    if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){try{await firebase.auth().signInWithRedirect(p);return}catch(e2){}}
    erroEntrada=MSG_ENTRADA[c]||('Não foi possível entrar ('+(c||'erro')+').');render()}
}
function sair(){
  confirmar('Sair da conta <b>'+esc((utilizador&&utilizador.email)||'')+'</b> neste aparelho?',async()=>{
    try{await firebase.auth().signOut()}catch(e){}

async function ligar(){
  if(!window.firebase){entrada='sem rede';render();return}
  if(!window.FIREBASE_CONFIG||!window.FIREBASE_CONFIG.apiKey){entrada='sem config';render();return}
  try{firebase.initializeApp(window.FIREBASE_CONFIG)}catch(e){}
  const fs=firebase.firestore();
  /* ligação por pedidos simples em vez de um canal contínuo: funciona mesmo com antivírus, bloqueadores ou redes que cortam o canal */
  try{fs.settings({experimentalForceLongPolling:true,merge:true})}catch(e){}
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  firebase.auth().getRedirectResult().catch(e=>{const c=e&&e.code;if(c){erroEntrada=MSG_ENTRADA[c]||('Não foi possível entrar ('+c+').');render()}});
  firebase.auth().onAuthStateChanged(u=>{
    utilizador=u;
    if(!u){if(entrada==='ok'){location.reload();return}entrada='entrar';render();return}
    if(!PERMITIDOS.includes(String(u.email||'').toLowerCase())){entrada='sem acesso';render();return}
    if(entrada==='ok')return;
    entrada='ok';render();ligarBase(criarDB(fs));
  });
}
/* erro da base: mostra-o no topo (não é escondido pelo "A demorar…") e escreve o motivo na consola */
function falhaBase(e){modo='erro';erroSync=(e&&e.code)||'erro';try{console.error('[Gestão de Cuidadoras] erro da base de dados:',e&&e.code,e&&e.message)}catch(_){}estado();pedirRender()}
function ligarBase(db){
  DB=db;modo='a ligar';estado();
  const t=setTimeout(()=>{if(!carregado.estado&&modo!=='erro'){modo='lento';estado()}},10000);
  db.doc('app/estado').onSnapshot(snap=>{
    if(snap.exists){
      const d=snap.data(),j=sJ(d);
      if(!sujos.has('estado')&&!emCurso.has('estado')&&j!==enviado.estado){S.colabs=clone(d.colabs||[]);S.config=clone(d.config||S.config);S.versao=d.versao||4;enviado.estado=j;fcache={};migrar();pedirRender()}
      else enviado.estado=enviado.estado||j;
    }
    if(!snap.metadata.fromCache){carregado.estado=true;clearTimeout(t);modo='ok';if(!snap.exists)pedirRender()}
    estado();
  },falhaBase);
  db.doc('app/saude').onSnapshot(snap=>{
    if(snap.exists){const d=snap.data(),j=sJ(d);
      if(!sujos.has('saude')&&!emCurso.has('saude')&&j!==enviado.saude){S.saude=clone(d);enviado.saude=j;pedirRender()}}
    if(!snap.metadata.fromCache&&!carregado.saude){carregado.saude=true;pedirRender();if(!S.saude)S.saude={};marcarSujos();if(sujos.size){clearTimeout(flushT);flushT=setTimeout(enviar,500)}}
  },falhaBase);
  db.collection('meses').onSnapshot(q=>{
    let mudou=false;
    q.docChanges().forEach(ch=>{const k=ch.doc.id,id='m:'+k;
      if(sujos.has(id)||emCurso.has(id))return;
      if(ch.type==='removed'){if(S.meses[k]){delete S.meses[k];delete enviado.meses[k];mudou=true}return}
      const d=ch.doc.data(),j=sJ(d);
      if(!sujos.has(id)&&j!==enviado.meses[k]){S.meses[k]=clone(d);enviado.meses[k]=j;mudou=true}});
    if(!q.metadata.fromCache)carregado.meses=true;
    if(mudou)pedirRender();
  },falhaBase);
}
function estado(){
  const el=document.getElementById('estado');if(!el)return;
  if(entrada!=='ok'){el.textContent='';el.className='estado';el.title='';return}
  let t,c='estado',tt='';
  if(modo==='local'){t='⚠️ Só neste browser';c+=' aviso';tt='Sem ligação à base partilhada: as alterações ficam só neste browser'}
  else if(modo==='erro'&&/permission/.test(erroSync)){t='⚠️ Sem permissão na base de dados';c+=' aviso';tt='O Firebase recusou o acesso: confirme as Regras do Firestore ('+erroSync+')'}
  else if(modo==='erro'){t='⚠️ Ligação perdida';c+=' aviso';tt='Recarregue a página ('+erroSync+')'}
  else if(!carregado.estado){t=modo==='lento'?'⏳ A demorar…':'⏳ A carregar…'}
  else if(aGravar||sujos.size){t='↻ A guardar…'}
  else if(erroSync){t='⚠️ '+erroSync;c+=' aviso'}
  else {t='☁️ Guardado';tt='Tudo guardado e partilhado'}
  el.className=c;el.textContent=t;el.title=tt;
}

function feriados(y){
  if(fcache[y])return fcache[y];
  const f={};
  [['01-01','Ano Novo'],['04-25','Dia da Liberdade'],['05-01','Dia do Trabalhador'],['06-10','Dia de Portugal'],['08-15','Assunção de Nossa Senhora'],['10-05','Implantação da República'],['11-01','Todos os Santos'],['12-01','Restauração da Independência'],['12-08','Imaculada Conceição'],['12-25','Natal']].forEach(([d,n])=>f[y+'-'+d]=n);
  const p=pascoa(y);
  f[dkey(addD(p,-2))]='Sexta-feira Santa';f[dkey(p)]='Páscoa';f[dkey(addD(p,60))]='Corpo de Deus';
  if(S.config.carnaval)f[dkey(addD(p,-47))]='Carnaval';
  (S.config.municipais||[]).forEach(m=>{if(m.ativo!==false&&/^\d\d-\d\d$/.test(m.mmdd)){const k=y+'-'+m.mmdd;f[k]=(f[k]?f[k]+' / ':'')+'Feriado municipal '+m.nome}});

function tipoDia(k){

const valorDiaMensal=c=>c.diasBase?num(c.mensal)/num(c.diasBase):0;
const valorHoraMensal=c=>num(c.horasDia)?valorDiaMensal(c)/num(c.horasDia):0;
function valorHora(c,tp='util'){
  if(c.modelo==='mensal')return valorHoraMensal(c);
  if(c.modelo==='sessao')return precoSessao(c)/(num(c.horasDia)||1);
  if(c.modelo==='hora')return num(c.taxas[tp]);
  return num(c.horasDia)?num(c.taxas[tp])/num(c.horasDia):0;
}
function valorDia(c,tp='util'){
  if(c.modelo==='mensal')return valorDiaMensal(c);
  if(c.modelo==='sessao')return precoSessao(c);
  if(c.modelo==='hora')return num(c.taxas[tp])*num(c.horasDia);
  return num(c.taxas[tp]);
}
function custoTurno(t,c){
  if(t.valor!==null&&t.valor!==undefined&&t.valor!=='')return num(t.valor);
  if(!c)return 0;
  if(c.modelo==='sessao')return precoSessao(c);   // cada registo = 1 sessão
  const tp=tipoDia(t.data),p=t.periodo||'dia';
  { // tabela de preços por período (manhã/tarde/noite × dia útil/sáb/dom/feriado), habitual e extra
    const ext=p.endsWith('X'),per=p.replace('X',''),T=(c.pp||{})[ext?'ext':'hab']||{},g=q=>num((T[tp]||{})[q]);
    const hora=c.modelo==='hora';
    if(!(c.modelo==='mensal'&&!ext)){
      if(per==='dia'){const v=g('manha')+g('tarde');if(v>0)return hora?num(t.horas)*(g('manha')||g('tarde')):v}
      else{const v=g(per);if(v>0)return hora?num(t.horas)*v:v}
    }
  }
  if(p==='noiteX')return num(c.noite)?num(c.noite):num(t.horas)*valorHora(c,tp);
  if(p==='diaX')return c.modelo==='dia'?num(c.taxas[tp]):num(t.horas)*valorHora(c,tp);
  if(p==='manhaX'||p==='tardeX')return num(t.horas)*valorHora(c,tp);
  // períodos habituais
  if(c.modelo==='mensal')return 0;
  if(p==='noite'&&num(c.noite))return num(c.noite);
  if(c.modelo==='hora')return num(t.horas)*num(c.taxas[tp]);
  if(p==='dia')return num(c.taxas[tp]);
  return num(c.horasDia)?num(c.taxas[tp])*num(t.horas)/num(c.horasDia):num(c.taxas[tp]);
}
const sinal=t=>['adiant','falta','menos'].includes(t)?-1:1;
function calcColab(c,M){
  const ts=M.turnos.filter(t=>t.colabId===c.id).sort((a,b)=>a.data<b.data?-1:1);
  const por={util:{n:0,h:0,v:0},sab:{n:0,h:0,v:0},dom:{n:0,h:0,v:0},fer:{n:0,h:0,v:0}};
  const ext={};['manha','tarde','noite',...EXT].forEach(p=>ext[p]={n:0,h:0,v:0,d:[]});
  let horas=0,vt=0,vd=0,nd=0;
  ts.forEach(t=>{const tp=tipoDia(t.data),v=custoTurno(t,c),p=t.periodo||'dia';
    if(p==='dia'){por[tp].n++;por[tp].h+=num(t.horas);por[tp].v+=v;vd+=v;nd++}
    else{const e=ext[p];if(!PER[p].extra){vd+=v;nd++}e.n++;e.h+=num(t.horas);e.v+=v;e.d.push(t.data.slice(8)+'/'+t.data.slice(5,7))}
    horas+=num(t.horas);vt+=v});
  const temBase=c.modelo==='mensal';
  const base=temBase?(M.base&&M.base[c.id]!==undefined&&M.base[c.id]!==''?num(M.base[c.id]):num(c.mensal)):0;
  const aj=M.ajustes.filter(a=>a.colabId===c.id).sort((a,b)=>(a.data||'')<(b.data||'')?-1:1);
  const ajTot=aj.reduce((s,a)=>s+sinal(a.tipo)*num(a.valor),0);
  // valor ganho no mês (os adiantamentos não reduzem o custo: são pagamentos antecipados)
  const ganho=base+vt+aj.filter(a=>a.tipo!=='adiant').reduce((s,a)=>s+sinal(a.tipo)*num(a.valor),0);
  const itens=[...ts.filter(t=>PER[t.periodo||'dia'].extra).map(t=>({k:'turno',o:t,data:t.data,v:custoTurno(t,c)})),
               ...aj.map(a=>({k:'aj',o:a,data:a.data||'',v:num(a.valor)}))].sort((x,y)=>x.data<y.data?-1:x.data>y.data?1:(ordemItem(x)-ordemItem(y)));
  const pagavel=x=>x.k==='turno'||x.o.tipo==='adiant'||sinal(x.o.tipo)>0;
  const pagoItens=itens.filter(x=>pagavel(x)&&x.o.pago).reduce((s,x)=>s+x.v,0);
  const PF=M.pagos&&M.pagos[c.id];
  const antesResto=r2(ganho-pagoItens);
  const resto=PF?(typeof PF==='string'||PF.valor==null?antesResto:num(PF.valor)):0;
  const pago=r2(pagoItens+resto),falta=r2(ganho-pago),total=ganho;
  return {ts,por,ext,horas,vt,vd,nd,base,temBase,aj,ajTot,total,ganho,itens,pagavel,pagoItens,PF,antesResto,resto,pago,falta};
}
function noPeriodo(c,key){const i=(c.inicio||'').slice(0,7),f=(c.fim||'').slice(0,7);return (!i||key>=i)&&(!f||key<=f)}
function colabsDoMes(M,key){
  return S.colabs.filter(c=>M.turnos.some(t=>t.colabId===c.id)||M.ajustes.some(a=>a.colabId===c.id)
    ||(M.pagos&&M.pagos[c.id])||(M.notas&&M.notas[c.id])||(M.base&&M.base[c.id]!==undefined&&M.base[c.id]!=='')
    ||(c.modelo==='mensal'&&c.ativo&&noPeriodo(c,key)));
}
function totaisMes(M,key){
  const cs=colabsDoMes(M,key).map(c=>({c,r:calcColab(c,M)}));
  const cuid=cs.reduce((s,x)=>s+x.r.total,0);
  const ent=M.entradas.reduce((s,e)=>s+num(e.valor),0);
  const casa=M.despesas.reduce((s,e)=>s+num(e.valor),0);
  const falta=r2(cs.reduce((s,x)=>s+Math.max(0,x.r.falta),0)),pago=r2(cs.reduce((s,x)=>s+x.r.pago,0));
  const ativos=cs.filter(x=>x.r.ganho>0.004);
  const estado=!ativos.length?'vazio':falta<=0.004?'pago':pago>0.004?'parcial':'porpagar';
  return {cs,cuid,ent,casa,saldo:ent-cuid-casa,falta,pago,estado};
}

    rows+=`<tr class="it${o.pago?' feito':''}"><td>${lab}<div class="acts noprint">${btn}${del}</div></td><td class="n ${cls}">${val}</td></tr>`;

  rows+=`<tr class="tot"><td>${r.falta<-0.004?'Pago a mais':'Falta pagar'}</td><td class="n ${r.falta<-0.004?'neg':''}">${eur(Math.abs(r.falta))}</td></tr>`;}
  const PF=r.PF,dPF=PF?(typeof PF==='string'?PF:PF.data):'';
  const sid='pag:'+c.id,ab=secEstado[sid]!==undefined?secEstado[sid]:!isPhone();
  return `<details class="card pag sec" data-sec="${sid}" style="--c:${c.cor}" ${ab?'open':''}>
    <summary class="sec-h"><span class="seta" aria-hidden="true">▾</span><span class="sec-t">${esc(c.nome)} <span class="tag">${c.semValor?'Família':c.tipo==='empresa'?'Empresa':'Pessoa'}</span>${r.falta<=0.004&&r.ganho>0?' <span class="tag" style="background:var(--green2);color:var(--green)">Tudo pago</span>':''}</span>
      <span class="sec-x small">${r.falta>0.004?'falta <b>'+eur(r.falta)+'</b>':r.ganho>0?'<span class="pos">✓ pago</span>':''}</span></summary>
    <div class="sec-b">
    ${c.semValor?`<div class="small mute">👪 Família: ajuda sem pagamento (não conta nos valores).${c.contacto?' · 📞 '+esc(c.contacto):''}</div>`:`<div class="small mute">${esc(MODELO[c.modelo])}${c.contacto?' · 📞 '+esc(c.contacto):''}</div>`}
    ${!c.semValor&&!temPrecoC(c)&&r.ts.length?`<div class="aviso-p">⚠️ ${esc(c.nome)} não tem preços na ficha: os turnos e extras contam 0 €. <button class="btn s" data-a="irFicha" data-id="${c.id}">✎ Preencher preços</button></div>`:''}
    <table style="margin-top:8px">${rows}</table>
    <div class="bar noprint" style="margin-top:8px"><button class="btn s" data-a="novoAj" data-id="${c.id}">+ Adiantamento / falta / extra</button><button class="btn s" data-a="relatorio" data-id="${c.id}">📋 Relatório do mês</button></div>${ssAtivo()&&S.config.ss.colabId===c.id?`<div class="bar noprint recibo-bar"><button class="btn p" data-a="recibo" data-id="${c.id}">🧾 Recibo de vencimento</button><button class="btn" data-a="reciboEmail" data-id="${c.id}">✉️ Enviar por email</button></div>`:''}
    <label class="f notas-mes" style="margin-top:10px">📝 Notas de ${esc(MESES[cur.m])}
      <textarea data-nota="${c.id}" placeholder="Escreva aqui notas sobre ${esc(c.nome)} neste mês (trocas de dias, combinações, recados…)">${esc((M.notas&&M.notas[c.id])||'')}</textarea></label>
    ${c.semValor?'':c.iban?`<div style="margin-top:8px" class="small">${c.titular?esc(c.titular)+'<br>':''}<span class="iban">${esc(fmtIban(c.iban))}</span> ${ok===true?'<span class="ok">✓</span>':ok===false?'<span class="ko">IBAN inválido</span>':''}
      <button class="btn s noprint" data-a="copiar" data-txt="${esc(String(c.iban).replace(/\s+/g,''))}">Copiar IBAN</button></div>`:'<div class="small mute" style="margin-top:8px">Sem IBAN registado.</div>'}
    ${PF?`<div class="pago">✓ Restante pago em ${dataPT(dPF)} (${eur(r.resto)}) <span style="flex:1"></span><button class="btn s noprint" data-a="pagarResto" data-id="${c.id}">Anular</button></div>`
       :r.antesResto>0.004?`<div class="pago" style="background:var(--acc2)"><span>Restante por pagar: <b>${eur(r.antesResto)}</b></span><span style="flex:1"></span><button class="btn s p noprint" data-a="pagarResto" data-id="${c.id}">💶 Pagar o restante</button></div>`:''}
  </div></details>`;
}
function vLinhas(M,qual,titulo){
  const tot=M[qual].reduce((s,e)=>s+num(e.valor),0);
  return sec('c-'+qual,titulo,`<table class="linhas">${M[qual].map(e=>`<tr><td><input type="text" data-linha="${qual}" data-id="${e.id}" data-k="desc" value="${esc(e.desc)}"></td>
    <td class="n"><input type="number" step="0.01" data-linha="${qual}" data-id="${e.id}" data-k="valor" value="${e.valor}"></td>
    <td class="n noprint"><button class="btn s d" data-a="delLinha" data-q="${qual}" data-id="${e.id}" title="Retirar">✕</button></td></tr>`).join('')}

}

        <div class="calc">${c.modelo==='hora'?`Dia de ${num(c.horasDia)}h: úteis ${eur(valorDia(c,'util'))} · sáb ${eur(valorDia(c,'sab'))} · dom ${eur(valorDia(c,'dom'))}`:`Por hora (dia de ${num(c.horasDia)}h): úteis ${eur(valorHora(c,'util'))} · sáb ${eur(valorHora(c,'sab'))}`}</div>`;
    }

      const tab=(g,tit,nota)=>`<div class="w pp"><div class="pp-t"><b>${tit}</b> <span class="small mute">${un}</span></div>
        <div class="pp-g"><span></span>${['manha','tarde','noite'].map(p=>`<span class="pp-h">${PI[p]}</span>`).join('')}
        ${['util','sab','dom','fer'].map(tp=>`<span class="pp-l">${TIPO[tp]}</span>`+['manha','tarde','noite'].map(p=>{const v=((c.pp||{})[g]||{})[tp]||{};return `<input type="number" step="0.01" min="0" inputmode="decimal" data-cf="pp.${g}.${tp}.${p}" data-id="${c.id}" value="${v[p]===''||v[p]===undefined?'':num(v[p])}" placeholder="auto">`}).join('')).join('')}</div>
        <div class="small mute" style="margin-top:4px">${nota}</div></div>`;
      pr+=(c.modelo==='mensal'?'':tab('hab','Preços do horário habitual','Vazio = “auto”: usa o preço do dia acima. Dia completo = manhã + tarde.'))
        +tab('ext','Preços dos extras',c.modelo==='mensal'?'Vazio = “auto”: horas do extra × valor por hora do mensal.':'Vazio = “auto”: horas do extra × valor por hora.');

    h+=`<details class="card col" style="--c:${c.cor}" data-cid="${c.id}" ${fichasAbertas.has(c.id)?'open':''}>
      <summary class="col-sum"><span class="dot" style="background:${c.cor}"></span><span class="col-nome">${esc(c.nome)||'(sem nome)'}</span>
        <span class="tag ${c.ativo?'':'off'}">${c.ativo?'Em serviço':'Inativo'}</span>
        <span class="col-info">${c.tipo==='empresa'?'Empresa':'Pessoa'} · ${resumo}${c.contacto?' · 📞 '+esc(c.contacto):''}</span>
        <span class="col-ab">✎ Editar</span></summary>
      <div class="head" style="margin-top:12px"><input type="color" data-cf="cor" data-id="${c.id}" value="${c.cor}" title="Cor no calendário" style="width:42px;height:38px;padding:2px">

        ${c.tipo!=='empresa'&&!c.semValor&&c.modelo!=='sessao'?`<div class="seglab w" style="margin-top:6px">🧾 Dados para o recibo de vencimento</div>`+f('nif','NIF')+f('niss','N.º Segurança Social (NISS)')+f('morada','Morada','text','w')+`<label class="f w">Categoria profissional<input type="text" data-cf="categoria" data-id="${c.id}" value="${esc(c.categoria||'')}" placeholder="Trabalhadora de serviço doméstico"></label>`:''}
        <label class="f w">Forma de pagamento<select data-cf="modelo" data-id="${c.id}">${Object.entries(MODELO).map(([k,v])=>`<option value="${k}" ${c.modelo===k?'selected':''}>${v}</option>`).join('')}</select></label>
        ${pr}
        ${c.modelo==='sessao'||true?'':`<label class="f">🌙 € por noite<input type="number" step="0.01" data-cf="noite" data-id="${c.id}" value="${num(c.noite)}"></label>
        <div class="calc">Extras: manhã/tarde <b>${eur(valorHora(c,'util'))}</b>/h${c.modelo!=='mensal'?' (dia útil)':''} · noite ${num(c.noite)?'<b>'+eur(num(c.noite))+'</b>':'à hora'}</div>`}
        <label class="f w">Notas<textarea data-cf="notas" data-id="${c.id}">${esc(c.notas)}</textarea></label>
      </div>
      <div class="bar" style="margin-top:10px"><label class="bar small"><input type="checkbox" data-cf="ativo" data-id="${c.id}" ${c.ativo?'checked':''}> Em serviço</label><label class="bar small"><input type="checkbox" data-cf="comparar" data-id="${c.id}" ${c.comparar!==false?'checked':''}> Entra em Comparar preços</label><label class="bar small"><input type="checkbox" data-cf="semValor" data-id="${c.id}" ${c.semValor?'checked':''}> 👪 Família (sem pagamento)</label><span style="flex:1"></span>
        ${c.iban?`<button class="btn s" data-a="copiar" data-txt="${esc(String(c.iban).replace(/\s+/g,''))}">Copiar IBAN</button>`:''}
        <button class="btn s d" data-a="delColab" data-id="${c.id}">Apagar</button></div>
    </details>`;
  });
  return h+'</div>';
}

/* --- comparar --- */
const CMP_OP=[['todos','Todos os dias'],['util','Dias úteis'],['fds','Fins de semana'],['sab','Só sábados'],['dom','Só domingos'],['fer','Feriados']];
function diasDoMes(qual){
  const y=cur.y,m=cur.m,nd=new Date(y,m+1,0).getDate(),r=[];
  for(let d=1;d<=nd;d++){const k=ymd(y,m,d),tp=tipoDia(k),w=diaSemana(k);
    const ok=qual==='todos'||(qual==='fds'&&(w===0||w===6))||(qual==='util'&&tp==='util')||(qual==='sab'&&w===6)||(qual==='dom'&&w===0)||(qual==='fer'&&tp==='fer');
    if(ok)r.push(k)}
  return r;
}
function vComparar(){
  const y=cur.y,m=cur.m;
  const escolhas=S.config.cmpDias||{};
  const escolha=c=>escolhas[c.id]||(c.comparar===false?'na':'geral');
  const qualDe=c=>{const e=escolha(c);return e==='geral'?comp.dias:e};
  const temPreco=c=>c.modelo==='mensal'?num(c.mensal)>0&&num(c.diasBase)>0&&num(c.horasDia)>0:temPrecoC(c);
  const custo=(c,dias)=>c.modelo==='mensal'?valorHoraMensal(c)*comp.horas*dias.length:dias.reduce((s,k)=>s+custoTurno({data:k,horas:comp.horas},c),0);
  const linhas=S.colabs.map(c=>{const q=qualDe(c),na=q==='na',dias=na?[]:diasDoMes(q),pr=temPreco(c);return {c,q,na,dias,pr,v:pr&&!na?custo(c,dias):0}});
  const ativas=linhas.filter(x=>!x.na&&x.pr).sort((a,b)=>a.v-b.v);
  const resto=linhas.filter(x=>x.na||!x.pr);
  const min=ativas.length?ativas[0].v:0;
  const geralLbl=(CMP_OP.find(o=>o[0]===comp.dias)||['',''])[1];
  const sel=x=>`<select data-cmpc="${x.c.id}" aria-label="Dias para ${esc(x.c.nome)}">
      <option value="geral" ${escolha(x.c)==='geral'?'selected':''}>Geral: ${esc(geralLbl.toLowerCase())}</option>
      ${CMP_OP.map(([k,v])=>`<option value="${k}" ${escolha(x.c)===k?'selected':''}>${v}</option>`).join('')}
      <option value="na" ${escolha(x.c)==='na'?'selected':''}>Não se aplica</option></select>`;
  const forma=c=>c.modelo==='sessao'?`Preço por sessão (${eur(precoSessao(c))})`:c.modelo==='mensal'?`Valor mensal fixo (${eur(num(c.mensal))}) · equivale a ${eur(valorHoraMensal(c))}/h`
    :`${c.modelo==='hora'?'Preço por hora':'Preço por dia'} (${eur(num(c.taxas.util))} úteis · ${num(c.taxas.sab)===num(c.taxas.dom)?eur(num(c.taxas.sab))+' fim de semana':eur(num(c.taxas.sab))+' sáb · '+eur(num(c.taxas.dom))+' dom'})`;
  const nome=c=>`<span class="chip" style="--c:${c.cor};display:inline-block">${esc(c.nome)}</span> ${c.ativo?'':'<span class="tag off">inativo</span>'}`;
  const M=monthData(K()),T=totaisMes(M,K());
  return sec('cmp','Comparar preços de '+MESES[m],`<div class="help">Quanto custaria <b>${MESES[m]} ${y}</b> com cada pessoa ou empresa. Escolha em cada uma os dias em que trabalharia, ou <b>Não se aplica</b> para a deixar de fora. Os feriados usam o preço de feriado; o valor mensal fixo conta pelo seu valor à hora.</div>
  <div class="card" style="margin-top:12px"><div class="bar">Dias (geral):
    <select id="cmpD">${CMP_OP.map(([k,v])=>`<option value="${k}" ${comp.dias===k?'selected':''}>${v}</option>`).join('')}</select>
    Horas por dia: <input type="number" id="cmpH" min="1" step="0.5" value="${comp.horas}" style="width:70px"></div>
  <table class="rt cmp" style="margin-top:10px"><tr><th>Pessoa / empresa</th><th>Dias</th><th>Forma</th><th class="n">Custo do mês</th><th class="n">Diferença face ao mais barato</th></tr>
  ${ativas.map(x=>`<tr><td class="rt-h">${nome(x.c)}</td><td data-l="Dias"><span class="cmp-dias">${sel(x)}<span class="small mute">${x.dias.length} dia(s)</span></span></td><td class="small mute" data-l="Forma"><span style="text-align:right">${forma(x.c)}</span></td><td class="n" data-l="Custo do mês"><span><b>${eur(x.v)}</b></span></td><td class="n ${x.v>min?'neg':'pos'}" data-l="Diferença"><span>${x.v>min?'+'+eur(x.v-min):eur(0)+' · ✓ mais barato'}</span></td></tr>`).join('')}
  </table>
  ${resto.length?`<div class="sem-preco"><b>Fora da comparação</b>
    ${resto.map(x=>`<div class="bar sp-l">${nome(x.c)}<span class="small mute">${x.na?'Não se aplica':'Sem preços na ficha'}</span><span style="flex:1"></span>${x.pr||x.c.semValor?'':`<button class="btn s" data-a="irFicha" data-id="${x.c.id}">✎ Preencher preços</button>`}${sel(x)}</div>`).join('')}</div>`:''}
  </div>
  <p class="small mute">Para comparar: o que está registado este mês com cuidadoras e empresas soma ${eur(T.cuid)}.</p>`);
}

/* --- ano --- */
function vAno(){
  const y=cur.y,t=new Date();
  let ks=Object.keys(S.meses).filter(k=>k.startsWith(y+'-')).sort();
  if(!ks.length)return `<div class="card mute">Ainda não há meses registados em ${y}.</div>`;
  const ini=+ks[0].slice(5)-1,fim=y<t.getFullYear()?11:y===t.getFullYear()?Math.max(t.getMonth(),+ks[ks.length-1].slice(5)-1):+ks[ks.length-1].slice(5)-1;
  const todos=[];for(let m=ini;m<=fim;m++)todos.push(mkey(y,m));
  ks=[...new Set([...todos,...ks])].sort();
  const MD=k=>S.meses[k]||monthData(k);
  let te=0,tc=0,tca=0;
  const linhas=ks.map(k=>{const T=totaisMes(MD(k),k);te+=T.ent;tc+=T.cuid;tca+=T.casa;const m=+k.slice(5)-1;
    return `<tr><td class="rt-h"><a href="#" data-a="irMes" data-k="${k}">${MESES[m]}</a>${S.meses[k]?'':' <span class="tag off">sem registos</span>'}</td><td class="n" data-l="Entradas"><span>${eur(T.ent)}</span></td><td class="n" data-l="Cuidadoras / empresas"><span>${eur(T.cuid)}</span></td><td class="n" data-l="Casa"><span>${eur(T.casa)}</span></td><td class="n ${T.saldo<0?'neg':'pos'}" data-l="Saldo"><span><b>${eur(T.saldo)}</b></span></td><td data-l="Pagamentos"><span style="text-align:right">${badgeEstado(T)}${T.estado!=='pago'&&T.falta>0?` <span class="small mute">falta ${eur(T.falta)}</span>`:''}</span></td></tr>`}).join('');
  const sal=te-tc-tca;
  const usados=S.colabs.filter(c=>ks.some(k=>{const M=MD(k);return colabsDoMes(M,k).includes(c)}));
  const mat=usados.map(c=>{const tot=ks.reduce((s2,k)=>{const M=MD(k);return s2+(colabsDoMes(M,k).includes(c)?calcColab(c,M).total:0)},0);if(Math.abs(tot)<0.005)return '';let t=0;const cel=ks.map(k=>{const M=MD(k);const v=colabsDoMes(M,k).includes(c)?calcColab(c,M).total:0;t+=v;return `<td class="n">${v?eur(v):'—'}</td>`}).join('');
    return `<tr><td><span class="chip" style="--c:${c.cor};display:inline-block">${esc(c.nome)}</span></td>${cel}<td class="n"><b>${eur(t)}</b></td></tr>`}).join('');
  return sec('a-res','📊 Resumo do ano '+y,`<table class="rt">

  return Object.assign({horas:40,salario:ref.smn,duo:'14',regime:'real',seguro:15,renda:0,smn:ref.smn,ias:ref.ias,irsTab:'1',dep:0},c,c&&c.duo==='12_50'?{duo:'14'}:{});

/* Retenção na fonte de IRS 2026 (Continente) — Despacho n.º 233-A/2026 */
const IRS_TAB={
  '1':{ad:21.43,L:[[920,0,0],[1042,.125,R=>.125*2.6*(1273.85-R)],[1108,.157,R=>.157*1.35*(1554.83-R)],[1154,.157,94.71],[1212,.212,158.18],[1819,.241,193.33],[2119,.311,320.66],[2499,.349,401.19],[3305,.3836,487.66]]},
  '3':{ad:42.86,L:[[991,0,0],[1042,.125,R=>.125*2.6*(1372.15-R)],[1108,.125,R=>.125*1.35*(1677.85-R)],[1119,.125,96.17],[1432,.1272,98.64],[1962,.157,141.32]]}};
IRS_TAB['2']={ad:34.29,L:IRS_TAB['1'].L};
const IRS_NOME={'1':'não casada, sem dependentes','2':'não casada, com dependentes','3':'casada, único titular'};
function retIRS(R,tab,dep){
  const T=IRS_TAB[tab]||IRS_TAB['1'];if(!(R>0))return {v:0,ok:true};
  const l=T.L.find(x=>R<=x[0]);if(!l)return {v:0,ok:false};
  const parc=typeof l[2]==='function'?l[2](R):l[2];
  return {v:Math.max(0,Math.floor(R*l[1]-parc-(l[1]?T.ad*(num(dep)||0):0))),ok:true};
}
function calcSS(p){
  let horas=num(p.horas);if(!(horas>0))horas=40;horas=Math.min(horas,40);
  const inteiro=horas>=40,sal=num(p.salario),seg=num(p.seguro),smn=num(p.smn),ias=num(p.ias);
  const minimo=r2(smn*horas/40);
  const subsMes=p.duo==='12'?sal*2/12:p.duo==='12_50'?sal/12:0;
  const pagoMes=r2(sal+subsMes);
  let te,tt,baseMes,baseAno,txtBase;
  if(p.regime==='real'){te=.223;tt=.11;baseMes=pagoMes;baseAno=sal*14;txtBase='salário real'}
  else{te=.189;tt=.094;
    if(inteiro){baseMes=ias;txtBase='IAS mensal'}
    else{const iasH=r2(ias*12/(52*40)),hm=Math.max(30,Math.round(horas*52/12));baseMes=r2(hm*iasH);txtBase=hm+' h × '+eur(iasH)}
    baseAno=baseMes*12}
  const ssE=r2(baseMes*te),ssT=r2(baseMes*tt);
  const tab=p.irsTab||'1',ri=retIRS(sal,tab,p.dep),taxaIRS=sal>0?ri.v/sal:0;
  const irsMes=r2(ri.v+Math.floor(subsMes*taxaIRS));        // salário + duodécimos
  const subUmaVez=p.duo==='14'?sal:p.duo==='12_50'?sal/2:0;
  const irsSub=subUmaVez?retIRS(subUmaVez,tab,p.dep).v:0;     // cada subsídio pago à parte
  const irsAno=r2(irsMes*12+irsSub*2);
  const liquido=r2(pagoMes-ssT-irsMes),custoMes=r2(pagoMes+ssE+seg);
  const ssEAno=r2(baseAno*te),ssTAno=r2(baseAno*tt);
  const custoAno=r2(sal*14+ssEAno+seg*12),liquidoAno=r2(sal*14-ssTAno-irsAno),media=r2(custoAno/12);
  const extraSub=p.duo==='14'?sal:p.duo==='12_50'?sal/2:0;
  const extraMes=r2(extraSub+(p.regime==='real'?extraSub*te:0));
  return {horas,inteiro,sal,seg,minimo,pagoMes,te,tt,baseMes,txtBase,ssE,ssT,irsMes,irsSub,irsAno,irsOk:ri.ok,irsTab:tab,liquido,custoMes,ssEAno,ssTAno,custoAno,liquidoAno,media,extraMes,abaixo:sal>0&&sal<minimo-0.005};
}

function proxPag(p,r){
  const mf=p.mesFerias!==undefined?+p.mesFerias:5,sal=r.sal,duo=p.duo,real=p.regime==='real',guia=r2(r.ssE+r.ssT);

  // próximos 12 meses
  const t=new Date(),hk=hojeK(),it=[];
  for(let i=0;i<13;i++){
    const y=t.getFullYear()+Math.floor((t.getMonth()+i)/12),m=(t.getMonth()+i)%12;
    const [py,pm]=mesAnterior(y,m);
    it.push({d:ymd(y,m,1),t:`💶 Salário de ${MESES[pm]}`,v:r.pagoMes});
    let g=guia;const [ppy,ppm]=mesAnterior(py,pm);
    if(duo!=='12'&&real){if(pm===mf)g=r2(g+ssSub(subFer));if(pm===11)g=r2(g+ssSub(subNat))}
    it.push({d:ymd(y,m,20),t:`🏛️ Segurança Social de ${MESES[pm]}`,v:g,nota:'entre 10 e '+(m===7?'31':'20')});
    if(duo!=='12'&&m===mf)it.push({d:ymd(y,m,1),t:'🏖️ Subsídio de férias',v:subFer,nota:'antes das férias'});
    if(duo!=='12'&&m===11)it.push({d:ymd(y,m,15),t:'🎄 Subsídio de Natal',v:subNat,nota:'até 15/12'});
    if(r.irsMes){let ir=r.irsMes;if(duo!=='12'&&(pm===mf||pm===11))ir=r2(ir+r.irsSub);
      it.push({d:ymd(y,m,20),t:`🧾 IRS retido de ${MESES[pm]} (DMR até dia 10)`,v:ir,nota:'pagar até dia 20'})}
    else if(m===1)it.push({d:ymd(y,m,10),t:`🧾 Modelo 10 de ${y-1} às Finanças`,v:0,nota:'até 10/02'});
    if(m===0)it.push({d:ymd(y,m,20),t:`📄 Declaração de rendimentos ${y-1} para a trabalhadora`,v:0,nota:'até 20/01'});
  }
  const fut=it.filter(x=>x.d>=hk.slice(0,8)+'01'&&x.d.slice(0,7)>=hk.slice(0,7)).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  const porMes={};fut.forEach(x=>{(porMes[x.d.slice(0,7)]=porMes[x.d.slice(0,7)]||[]).push(x)});
  const meses=Object.keys(porMes).slice(0,12);
  return {porMes,meses,hk};
}

const ICONE_SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#2f6f62"/><path d="M13 31 32 15l19 16M18.5 27v20.5h27V27" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 43.5c-6-3.9-8.6-6.8-8.6-9.6a4.3 4.3 0 0 1 8.6-.6 4.3 4.3 0 0 1 8.6.6c0 2.8-2.6 5.7-8.6 9.6z" fill="#f2b8a2"/></svg>';
async function baixarIcone(){
  try{const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(ICONE_SVG);await img.decode();
    const cv=document.createElement('canvas');cv.width=cv.height=512;cv.getContext('2d').drawImage(img,0,0,512,512);
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
    if(dl){try{await dl.save({filename:'icone-cuidadoras.png',data:blob});toast('Ícone guardado')}catch(e){if(e&&e.code==='declined')return;toast('Não foi possível guardar o ícone')}}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='icone-cuidadoras.png';a.click()}
  }catch(e){toast('Não foi possível preparar o ícone')}
}

/* ---------- anexos (PDF e fotografias) nas consultas e exames ----------
   O ficheiro é guardado no Firestore em pedaços (documentos anexos/<id>-0, -1, …), porque cada documento só aceita até 1 MB.
   Na consulta fica só a ficha do anexo: {id,nome,tipo,tam,partes,em,por}. Assim funciona no plano gratuito, sem Storage. */
const ANX_MAX=10*1024*1024,ANX_PEDACO=700000,ANX_LIVRE=1024*1024*1024;
let anxCache={},anxOcupado=false;
const fmtTam=b=>b>=1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' KB';
function todosAnexos(){const L=[];['pai','mae'].forEach(p=>{const P=S.saude&&S.saude[p];if(P&&Array.isArray(P.consultas))P.consultas.forEach(c=>(c.anexos||[]).forEach(a=>L.push({p,c,a})))});return L}
function vAnexos(p,c){const A=c.anexos||[];if(!A.length)return '';
  return `<div class="anx-l">${A.map(a=>`<div class="anx"><span class="anx-n" title="${esc(a.nome)}">📎 ${esc(a.nome)}</span><span class="small mute">${fmtTam(a.tam)}</span>
    <span class="anx-b"><button class="btn s" data-a="anxAbrir" data-p="${p}" data-c="${c.id}" data-id="${a.id}">Abrir</button><button class="btn s" data-a="anxBaixar" data-p="${p}" data-c="${c.id}" data-id="${a.id}">Descarregar</button><button class="btn s d" data-a="anxApagar" data-p="${p}" data-c="${c.id}" data-id="${a.id}" title="Apagar anexo">✕</button></span></div>`).join('')}</div>`}
const lerB64=b=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=()=>ko(r.error);r.readAsDataURL(b)});
/* fotografias grandes: reduz para no máximo 2000 px e JPEG — ficam legíveis e muito mais leves */
async function reduzFoto(f){
  if(!/^image\//.test(f.type)||f.size<900*1024||/gif|svg/.test(f.type))return f;
  try{const url=URL.createObjectURL(f),img=new Image();img.src=url;await img.decode();
    const k=Math.min(1,2000/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement('canvas');
    cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
    const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.82));if(!b||b.size>=f.size)return f;
    return new File([b],f.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'})}catch(e){return f}
}
async function gravarPartes(id,b64,progresso){
  const n=Math.max(1,Math.ceil(b64.length/ANX_PEDACO));
  for(let i=0;i<n;i++){
    let t=0;for(;;){try{await DB.doc('anexos/'+id+'-'+i).set({d:b64.slice(i*ANX_PEDACO,(i+1)*ANX_PEDACO)});break}
      catch(e){if(e&&e.code==='unavailable'&&t++<3){await dorme(1500);continue}
        for(let j=0;j<i;j++){try{await DB.doc('anexos/'+id+'-'+j).delete()}catch(_){}}throw e}}
    if(progresso)progresso(i+1,n)}
  return n;
}
function apagarPartes(a){delete anxCache[a.id];if(!DB)return;for(let i=0;i<(a.partes||1);i++)DB.doc('anexos/'+a.id+'-'+i).delete().catch(()=>{})}
async function lerAnexo(a){
  if(anxCache[a.id])return anxCache[a.id];
  let b64='';for(let i=0;i<(a.partes||1);i++){const s=await DB.doc('anexos/'+a.id+'-'+i).get();if(!s.exists)throw {code:'em-falta'};b64+=(s.data()||{}).d||''}
  const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return anxCache[a.id]=new Blob([u],{type:a.tipo||'application/octet-stream'});
}
async function lerB64Anexo(a){let b64='';for(let i=0;i<(a.partes||1);i++){const s=await DB.doc('anexos/'+a.id+'-'+i).get();if(!s.exists)throw {code:'em-falta'};b64+=(s.data()||{}).d||''}return b64}
async function anexar(p,cid,files){
  if(!DB||!carregado.saude){toast('Espere que os dados acabem de carregar e tente de novo.');return}
  if(anxOcupado){toast('Ainda estou a enviar o anexo anterior. Espere um pouco.');return}
  anxOcupado=true;let feitos=0;
  try{for(const f0 of files){
    const c=SP(p).consultas.find(x=>x.id===cid);if(!c)break;
    if(!/^application\/pdf$|^image\//.test(f0.type)&&!/\.pdf$/i.test(f0.name)){toast('“'+f0.name+'” não é PDF nem fotografia.');continue}
    const f=await reduzFoto(f0);
    if(f.size>ANX_MAX){abrir(`<h3>Ficheiro demasiado grande</h3><p><b>${esc(f0.name)}</b> tem ${fmtTam(f.size)}. O máximo é <b>10 MB</b> por ficheiro.</p><p class="small mute">Exames de imagem (TAC, ressonância) têm centenas de MB: anexe só o <b>relatório</b> em PDF.</p><div class="bar" style="justify-content:flex-end"><button class="btn p" data-a="fechar">OK</button></div>`);continue}
    const usado=todosAnexos().reduce((t,x)=>t+x.a.tam,0);
    if((usado+f.size)*1.37>ANX_LIVRE*0.9){toast('O espaço gratuito para anexos está quase cheio. Apague anexos antigos.');continue}
    toast('A enviar “'+f.name+'”…');
    const id='x'+uid()+uid(),b64=await lerB64(f);
    const partes=await gravarPartes(id,b64,(i,n)=>{if(n>1)toast('A enviar “'+f.name+'”: '+Math.round(i/n*100)+'%')});
    const c2=SP(p).consultas.find(x=>x.id===cid);
    if(!c2){apagarPartes({id,partes});break}
    (c2.anexos=c2.anexos||[]).push({id,nome:f.name,tipo:f.type||'application/pdf',tam:f.size,partes,em:hojeK(),por:(utilizador&&utilizador.email)||''});
    anxCache[id]=f;feitos++;save();render();
  }

  }catch(e){toast('Não foi possível enviar o anexo'+(e&&e.code==='permission-denied'?' (sem permissão)':'')+'. Tente de novo.')}
  finally{anxOcupado=false}
}

function copiar(t,msg){
  const ok=()=>toast(msg||('IBAN copiado: '+fmtIban(t)));
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>fall());else fall();
  function fall(){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');ok()}catch(e){toast(t)}x.remove()}
}

  }
  if(el.dataset.linha){const M=ensureMonth(K());const x=M[el.dataset.linha].find(r=>r.id===el.dataset.id);if(x){x[el.dataset.k]=el.dataset.k==='valor'?num(el.value):el.value;save();render()}return}
  if(el.dataset.base){const M=ensureMonth(K());if(el.value==='')delete M.base[el.dataset.base];else M.base[el.dataset.base]=num(el.value);save();render();return}
  if(el.dataset.pago){const M=ensureMonth(K());if(el.checked)M.pagos[el.dataset.pago]=hojeK();else delete M.pagos[el.dataset.pago];save();render();return}
  if(el.dataset.mun){const m=S.config.municipais.find(x=>x.id===el.dataset.mun);if(!m)return;
    if(el.dataset.k==='nome')m.nome=el.value;
    else if(el.dataset.k==='ativo')m.ativo=el.checked;
    else{const mt=el.value.match(/^(\d{1,2})[\/\-.](\d{1,2})$/);if(mt)m.mmdd=pad(+mt[2])+'-'+pad(+mt[1]);else toast('Escreva o dia como dd/mm, ex.: 08/09')}
    fcache={};save();render();return}
  if(el.dataset.hor){S.config.horarios[el.dataset.hor][el.dataset.k]=el.value;sincDia();save();render();return}
  if(el.id==='carnaval'){S.config.carnaval=el.checked;fcache={};save();render();return}
  if(el.id==='qfC')modalDia.cid=el.value;
  if(el.id==='qfC'||el.id==='qfP'){const c=colab(document.getElementById('qfC').value),p=document.getElementById('qfP').value,hr=S.config.horarios[p];
    document.getElementById('qfH').value=horasBlocos(isDia(p)?hr:{ini:hr.ini,fim:hr.fim});return}
  if(el.dataset&&el.dataset.rc){S.config.recibo=S.config.recibo||{};S.config.recibo[el.dataset.rc]=el.value.trim();save();return}
  if(el.dataset&&el.dataset.ss){const k=el.dataset.ss;S.config.ss=S.config.ss||{};
    if(k==='inicio'){S.config.ss.inicio=el.value;save();render();return}
    if(k==='colabId'){S.config.ss.colabId=el.value;const c=colab(el.value);if(c){S.config.ss.salario=num(c.mensal)}}
    else S.config.ss[k]=num(el.value);
    save();render();return}
  if(el.dataset&&el.dataset.cmpc){S.config.cmpDias=S.config.cmpDias||{};if(el.value==='geral')delete S.config.cmpDias[el.dataset.cmpc];else S.config.cmpDias[el.dataset.cmpc]=el.value;save();render();return}
  if(el.id==='cmpD'){comp.dias=el.value;render();return}
  if(el.id==='cmpH'){comp.horas=num(el.value)||8;render();return}
  if(el.matches&&el.matches('input[type=file][data-imp]')&&el.files[0]){
    const f=el.files[0];el.value='';
    const lerTexto=()=>f.text?f.text():new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>ko(r.error);r.readAsText(f)});
    lerTexto().then(txt=>{
      let d;
      try{d=JSON.parse(String(txt).replace(/^﻿/,''))}catch(_){abrir(`<h3>Não foi possível abrir</h3><p>O ficheiro <b>${esc(f.name)}</b> não é uma cópia desta aplicação.</p><p class="small mute">Escolha o ficheiro que termina em <b>.json</b> (por exemplo gestao-cuidadoras-2026-11-03.json), não o ficheiro .html.</p><div class="bar" style="justify-content:flex-end"><button class="btn p" data-a="fechar">OK</button></div>`);return}
      if(!d||!Array.isArray(d.colabs)){abrir(`<h3>Não foi possível abrir</h3><p>O ficheiro <b>${esc(f.name)}</b> não tem os dados das pessoas e empresas.</p><div class="bar" style="justify-content:flex-end"><button class="btn p" data-a="fechar">OK</button></div>`);return}
      d.meses=d.meses||{};if(!d.saude&&S.saude)d.saude=S.saude;
      const AD=d.anexosDados||null;delete d.anexosDados;const nAD=AD?Object.keys(AD).length:0;
      confirmar(`Abrir <b>${esc(f.name)}</b>? Os dados partilhados <b>de todos</b> serão substituídos pelos do ficheiro (${d.colabs.length} pessoas/empresas, ${Object.keys(d.meses).length} mês/meses${nAD?`, ${nAD} anexo(s)`:''}).`,async()=>{S=d;migrar();fcache={};anxCache={};save();render();
        if(!nAD){toast('Ficheiro aberto: dados atualizados para todos');return}
        let i=0,falhas=0;
        for(const x of todosAnexos()){const b=AD[x.a.id];if(!b)continue;i++;toast('A repor anexos: '+i+' de '+nAD);
          try{x.a.partes=await gravarPartes(x.a.id,b)}catch(e){falhas++}}
        save();render();toast(falhas?'Dados repostos; '+falhas+' anexo(s) não foram repostos':'Ficheiro aberto: dados e anexos repostos')},'Sim, abrir');
    }).catch(()=>toast('Não foi possível ler o ficheiro. Tente de novo.'));
  }
});

(()=>{const hd=document.querySelector('header');let on=false;
  window.addEventListener('scroll',()=>{const y=window.scrollY;if(!on&&y>140){on=true;hd.classList.add('compacto')}else if(on&&y<30){on=false;hd.classList.remove('compacto')}},{passive:true})})();
render();
{const l=document.getElementById('logoTopo');if(l)l.innerHTML=ICONE_SVG}
ligar();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
